<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Business Scraper - Lead Generation Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .form-section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .checkbox-group {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .status-section {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        
        .status {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 10px;
        }
        
        .status.running {
            color: #007bff;
        }
        
        .status.success {
            color: #28a745;
        }
        
        .status.error {
            color: #dc3545;
        }
        
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 10px;
            display: none;
        }
        
        .progress-bar.active {
            display: block;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .results-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        
        .results-section.active {
            display: block;
        }
        
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .results-count {
            font-size: 1.2em;
            color: #667eea;
            font-weight: 600;
        }
        
        .results-list {
            max-height: 500px;
            overflow-y: auto;
        }
        
        .result-item {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .result-item h3 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .result-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .result-detail {
            font-size: 0.9em;
        }
        
        .result-detail strong {
            color: #667eea;
        }
        
        .files-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .files-list {
            margin-top: 15px;
        }
        
        .file-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .file-info {
            flex: 1;
        }
        
        .file-name {
            font-weight: 600;
            color: #333;
        }
        
        .file-size {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        
        .hidden {
            display: none;
        }
        
        .web-params {
            display: none;
        }
        
        .web-params.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Google Business Scraper</h1>
            <p>Lead Generation Tool - Extract Business Information from Google</p>
        </div>
        
        <div class="content">
            <form id="scraperForm">
                <div class="form-section">
                    <h2>Scraper Type</h2>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="maps" name="scraper_type" value="maps" checked>
                            <label for="maps">Google Maps Scraper</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="web" name="scraper_type" value="web">
                            <label for="web">Google Web Scraper</label>
                        </div>
                    </div>
                </div>
                
                <div class="form-section">
                    <h2>Search Parameters</h2>
                    <div class="form-group">
                        <label for="business_name">Business Name/Query:</label>
                        <input type="text" id="business_name" name="business_name" 
                               placeholder="e.g., medical stores" value="medical stores" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="location">Location:</label>
                        <input type="text" id="location" name="location" 
                               placeholder="e.g., Lahore" value="Lahore">
                    </div>
                    
                    <div class="form-group web-params" id="webParams">
                        <label>Web Scraper Options:</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px;">
                            <div>
                                <label for="max_results">Max Results (0 = unlimited):</label>
                                <input type="number" id="max_results" name="max_results" value="0" min="0">
                            </div>
                            <div>
                                <label for="max_pages">Max Pages:</label>
                                <input type="number" id="max_pages" name="max_pages" value="8" min="1" max="10">
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="form-section">
                    <h2>Options</h2>
                    <div class="checkbox-group">
                        <div class="checkbox-option">
                            <input type="checkbox" id="export_excel" name="export_excel" checked>
                            <label for="export_excel">Export to Excel</label>
                        </div>
                        <div class="checkbox-option">
                            <input type="checkbox" id="export_csv" name="export_csv" checked>
                            <label for="export_csv">Export to CSV</label>
                        </div>
                        <div class="checkbox-option">
                            <input type="checkbox" id="headless" name="headless">
                            <label for="headless">Headless Mode (Hide Browser)</label>
                        </div>
                    </div>
                    
                    <div class="form-group" style="margin-top: 20px;">
                        <label for="output_folder">Output Folder:</label>
                        <input type="text" id="output_folder" name="output_folder" 
                               value="excel_results" placeholder="excel_results">
                    </div>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn-primary" id="startBtn">Start Scraping</button>
                    <button type="button" class="btn-secondary" id="stopBtn" disabled>Stop</button>
                    <button type="button" class="btn-success" id="refreshFilesBtn">Refresh Files</button>
                </div>
            </form>
            
            <div class="status-section">
                <div class="status" id="statusText">Ready</div>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill"></div>
                </div>
            </div>
            
            <div class="results-section" id="resultsSection">
                <div class="results-header">
                    <div class="results-count" id="resultsCount">0 results</div>
                </div>
                <div class="results-list" id="resultsList"></div>
            </div>
            
            <div class="files-section">
                <h2>Output Files</h2>
                <div class="files-list" id="filesList">
                    <p>No files yet. Start scraping to generate files.</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let statusCheckInterval = null;
        
        // Toggle web params visibility
        document.querySelectorAll('input[name="scraper_type"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const webParams = document.getElementById('webParams');
                if (this.value === 'web') {
                    webParams.classList.add('active');
                } else {
                    webParams.classList.remove('active');
                }
            });
        });
        
        // Form submission
        document.getElementById('scraperForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                scraper_type: document.querySelector('input[name="scraper_type"]:checked').value,
                business_name: document.getElementById('business_name').value,
                location: document.getElementById('location').value,
                max_results: document.getElementById('max_results').value,
                max_pages: document.getElementById('max_pages').value,
                export_excel: document.getElementById('export_excel').checked,
                export_csv: document.getElementById('export_csv').checked,
                headless: document.getElementById('headless').checked,
                output_folder: document.getElementById('output_folder').value
            };
            
            try {
                const response = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('startBtn').disabled = true;
                    document.getElementById('stopBtn').disabled = false;
                    document.getElementById('progressBar').classList.add('active');
                    startStatusCheck();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
        
        // Status check
        function startStatusCheck() {
            statusCheckInterval = setInterval(async () => {
                try {
                    const response = await fetch('/api/status');
                    const status = await response.json();
                    
                    document.getElementById('statusText').textContent = status.progress || 'Processing...';
                    document.getElementById('statusText').className = 'status ' + 
                        (status.is_running ? 'running' : (status.error ? 'error' : 'success'));
                    
                    if (!status.is_running) {
                        clearInterval(statusCheckInterval);
                        document.getElementById('startBtn').disabled = false;
                        document.getElementById('stopBtn').disabled = true;
                        document.getElementById('progressBar').classList.remove('active');
                        
                        if (status.error) {
                            alert('Error: ' + status.error);
                        } else if (status.results && status.results.length > 0) {
                            displayResults(status.results);
                            loadFiles();
                        }
                    }
                } catch (error) {
                    console.error('Status check error:', error);
                }
            }, 2000);
        }
        
        // Display results
        function displayResults(results) {
            const resultsSection = document.getElementById('resultsSection');
            const resultsList = document.getElementById('resultsList');
            const resultsCount = document.getElementById('resultsCount');
            
            resultsSection.classList.add('active');
            resultsCount.textContent = `${results.length} results`;
            
            resultsList.innerHTML = results.map((result, index) => {
                const name = result.name || result.title || 'N/A';
                const phone = result.phone || 'N/A';
                const email = result.email || 'N/A';
                const address = result.address || 'N/A';
                const website = result.website || result.url || 'N/A';
                const score = result.lead_score || 0;
                const status = result.lead_status || 'N/A';
                
                return `
                    <div class="result-item">
                        <h3>${index + 1}. ${name}</h3>
                        <div class="result-details">
                            <div class="result-detail"><strong>Phone:</strong> ${phone}</div>
                            <div class="result-detail"><strong>Email:</strong> ${email}</div>
                            <div class="result-detail"><strong>Address:</strong> ${address}</div>
                            <div class="result-detail"><strong>Website:</strong> ${website}</div>
                            <div class="result-detail"><strong>Lead Score:</strong> ${score}/100</div>
                            <div class="result-detail"><strong>Status:</strong> ${status}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Load files
        async function loadFiles() {
            try {
                const response = await fetch('/api/files');
                const data = await response.json();
                
                const filesList = document.getElementById('filesList');
                
                if (data.files && data.files.length > 0) {
                    filesList.innerHTML = data.files.map(file => {
                        const sizeKB = (file.size / 1024).toFixed(2);
                        const date = new Date(file.modified).toLocaleString();
                        return `
                            <div class="file-item">
                                <div class="file-info">
                                    <div class="file-name">${file.name}</div>
                                    <div class="file-size">${sizeKB} KB • ${date}</div>
                                </div>
                                <a href="/api/download/${file.name}" class="btn-primary" style="text-decoration: none; padding: 10px 20px;">Download</a>
                            </div>
                        `;
                    }).join('');
                } else {
                    filesList.innerHTML = '<p>No files yet. Start scraping to generate files.</p>';
                }
            } catch (error) {
                console.error('Error loading files:', error);
            }
        }
        
        // Refresh files button
        document.getElementById('refreshFilesBtn').addEventListener('click', loadFiles);
        
        // Load files on page load
        loadFiles();
    </script>
</body>
</html>
